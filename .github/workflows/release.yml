# A version tag on main publishes that commit's images for self-hosters (team practice).
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write
  actions: read

env:
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/context-engine

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: The tag is on main and ci passed on its commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          conclusion=$(gh run list --workflow ci --commit "$GITHUB_SHA" --branch main --json conclusion --jq '.[0].conclusion')
          test "$conclusion" = success
      - name: Tag the commit's images with the version
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          version="${GITHUB_REF_NAME#v}"
          minor="${version%.*}"
          # web-hosted is for the team's hosted copy only.
          for name in web api worker migrate; do
            docker buildx imagetools create \
              -t "$IMAGE_PREFIX-$name:$version" -t "$IMAGE_PREFIX-$name:$minor" \
              "$IMAGE_PREFIX-$name:$GITHUB_SHA"
          done
